apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-actions-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GITHUB_USERNAME/github-actions-argocd-gitops.git
    targetRevision: main
    path: helm/app
    helm:
      releaseName: gitops-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
